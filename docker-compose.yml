version: '3.8'

# 互动服务独立编排：只依赖 PostgreSQL（自有 community schema）与两个上游
# （目录服务判可见性、账号服务签令牌）。切流前单体仍在服务流量，两者共用同一库。
services:
  community:
    build: .
    container_name: metafusion-community
    restart: unless-stopped
    environment:
      - PORT=8083
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-metafusion}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      - DB_NAME=${COMMUNITY_DB_NAME:-metafusion_db}
      # 账号服务上线前指向目录服务的 JWKS，上线后只改这一个变量。
      - COMMUNITY_JWKS_URL=${COMMUNITY_JWKS_URL:-http://catalog:8080/api/oidc/jwks}
      - CATALOG_URL=${CATALOG_URL:-http://catalog:8080}
      - AUTH_JWT_ISSUER=${AUTH_JWT_ISSUER:-https://findverse.cc/api}
      - AUTH_JWT_AUDIENCE=${AUTH_JWT_AUDIENCE:-metafusion}
    ports:
      - "8083:8083"
    networks:
      - metafusion-net

networks:
  metafusion-net:
    external: true
