version: '3.8'

# 互动服务独立编排：只依赖 PostgreSQL（自有 community schema）与两个上游
# （目录服务判可见性、账号服务签令牌）。业务容器只使用互动域数据库身份。
services:
  community:
    build: .
    container_name: metafusion-community
    restart: unless-stopped
    environment:
      - PORT=8083
      - DATABASE_URL=${COMMUNITY_DATABASE_URL:?COMMUNITY_DATABASE_URL must be set in .env}
      # 账号服务是唯一签发方：JWKS 与不透明会话令牌的兜底都问它（与主工程编排一致）。
      - COMMUNITY_JWKS_URL=${COMMUNITY_JWKS_URL:-http://auth:8081/api/oidc/jwks}
      - AUTH_URL=${AUTH_URL:-http://auth:8081}
      # 目录服务在主工程编排里叫 backend（没有叫 catalog 的服务）。
      - CATALOG_URL=${CATALOG_URL:-http://backend:8080}
      - AUTH_JWT_ISSUER=${AUTH_JWT_ISSUER:-https://findverse.cc/api}
      - AUTH_JWT_AUDIENCE=${AUTH_JWT_AUDIENCE:-metafusion}
    ports:
      - "8083:8083"
    networks:
      - metafusion-net

networks:
  metafusion-net:
    external: true
